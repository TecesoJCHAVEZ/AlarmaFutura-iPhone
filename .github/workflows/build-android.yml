name: Compilar Alarma Futura Android

on:
  push:
    branches:
      - android-port-v1
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Android APK Debug
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compilar APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Preparar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AlarmaFutura-Android-debug.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: AlarmaFutura-Android-debug
          path: AlarmaFutura-Android-debug.apk
          if-no-files-found: error
          retention-days: 30
